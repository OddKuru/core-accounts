version: 3

env:
  GO_VERSION: '1.25'
  GOLANGCI_LINT_VERSION: 'v2.10.1'
  GCI_VERSION: 'v0.13.7'
  GOFUMPT_VERSION: 'v0.9.2'

  PATH_BIN_DIR: '{{.ROOT_DIR}}/bin'
  PATH_GOLANGCI_LINT: '{{.PATH_BIN_DIR}}/golangci-lint'
  PATH_GOLANGCI_LINT_CONFIG: '.golangci.yml'
  PATH_GCI: '{{.PATH_BIN_DIR}}/gci'
  PATH_GOFUMPT: '{{.PATH_BIN_DIR}}/gofumpt'

  PATH_MAIN: cmd/core-accounts/main.go
  PATH_DEV_CFG: config/dev.yaml
  PATH_LOCAL_CFG: config/local.yaml
  PATH_MIGRATION_PSQL_DIR: migration/pgx_goose_migration

  PROTO_SRC: proto
  PROTO_OUT: gogen

tasks:
  install-linters:
    desc: "install linters to bin"
    cmds:
      - |
        [ -f {{.PATH_GOLANGCI_LINT}} ] || {
          echo 'install golangci-lint {{.GOLANGCI_LINT_VERSION}}...'
          GOBIN={{.PATH_BIN_DIR}} go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@{{.GOLANGCI_LINT_VERSION}}
        }
    status:
      - test -x {{.PATH_GOLANGCI_LINT}}

  lint:
    desc: "start lint on all module"
    deps: [ install-linters ]
    cmds:
      - '{{.PATH_GOLANGCI_LINT}} run ./... --config={{.PATH_GOLANGCI_LINT_CONFIG}}'

  dev:
    desc: "start app on developer mode"
    cmds:
      - CONFIG_PATH=$PATH_DEV_CFG go run -race $PATH_MAIN run

  proto:
    desc: "generate proto files to out dir"
    cmds:
      - |
        sh -c '
          PROTO_FILES=$(find {{.PROTO_SRC}} -name "*.proto");
          protoc \
            --proto_path={{.PROTO_SRC}}/third_party \
            --proto_path={{.PROTO_SRC}} \
            $PROTO_FILES \
            --go-grpc_opt=require_unimplemented_servers=false \
            --go_out={{.PROTO_OUT}} \
            --go_opt=paths=source_relative \
            --go-grpc_out={{.PROTO_OUT}} \
            --go-grpc_opt=paths=source_relative
        '
  migration:
    # goose -dir migration/postgres create name_file sql
    cmds:
      - export GOOSE_DRIVER=postgres
      - export GOOSE_DBSTRING=postgresql://eer0:secret@localhost:10101/accounts?sslmode=disable
      - export GOOSE_MIGRATION_DIR=migration/postgres
      - goose up